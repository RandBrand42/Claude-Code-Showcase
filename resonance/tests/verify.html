<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Resonance - style & song verification</title>
<!--
  Loads only the audio engine, sequencer, presets and style code (no UI), and exposes two functions on window:

    verifyLogic()                      -> { fails: [...], checks: n }      musical invariants, no audio
    renderOffline(opts)                -> Promise<metrics>                 renders audio offline and measures it
         opts: { factory: index | song: id, style: id, secs, steps: stepsIndex }

  Run it with the project harness, e.g.
    node tools/browse.mjs resonance/tests/verify.html --script=<scenario.mjs>
  where the scenario calls page.eval("verifyLogic()") and page.eval("renderOffline({...})").
-->
</head>
<body>
<pre id="out">Resonance verification page. Call verifyLogic() / renderOffline() from the console.</pre>
<script src="../js/core.js"></script>
<script src="../js/engine.js"></script>
<script src="../js/seq.js"></script>
<script src="../js/presets.js"></script>
<script src="../js/styles.js"></script>
<script src="../js/songs.js" onerror="void 0"></script>
<script>
(function () {
  'use strict';
  const R = window.R, E = R.Engine;
  const snap = () => { const s = R.Presets.snapshot(); return JSON.stringify({ params: s.params, song: s.song }); };

  /* ---------------- logic ---------------- */
  window.verifyLogic = function (opts) {
    opts = opts || {};
    const fails = []; let checks = 0;
    const check = (cond, msg) => { checks++; if (!cond) fails.push(msg); };

    // 1. every parameter a style names is real and inside its range
    for (const s of R.Style.list) {
      for (const [k, v] of Object.entries(s.params)) {
        const d = R.PDEF[k];
        check(!!d, s.id + ': unknown parameter ' + k);
        if (d) check(Math.abs(R.coerce(d, v) - v) < 1e-9, s.id + ': ' + k + '=' + v + ' is outside its range (would become ' + R.coerce(d, v) + ')');
      }
    }

    // 2. per source song and per pattern length
    const sources = opts.sources || [0, 3, 8, 10];
    for (const src of sources) {
      for (const stepsIdx of [0, 1, 2, 3, 4]) {            // 8, 16, 32, 12, 24 steps
        if (typeof src === 'number') R.Presets.loadFactory(src); else R.Songs.load(src);
        R.setParam('steps', stepsIdx);
        R.Style.current = 'original'; R.Style.base = null;
        const S = R.STEPS[stepsIdx], tag = (typeof src === 'number' ? R.Presets.factory[src].name : src) + '@' + S;
        const base = R.Presets.snapshot(), baseKey = snap();

        for (const s of R.Style.list) {
          R.Style.apply(s.id);
          const now = R.Presets.snapshot();
          const where = tag + ' -> ' + s.id;
          // melody identity: same steps on, same notes, in every pattern
          for (let pi = 0; pi < 4; pi++) {
            for (let k = 0; k < S; k++) {
              const a = base.song.pats[pi].m[k], b = now.song.pats[pi].m[k];
              if (a[0] !== b[0] || (a[0] && a[1] !== b[1])) { check(false, where + ': melody changed in pattern ' + 'ABCD'[pi] + ' step ' + (k + 1)); break; }
            }
            // drums never spill past the pattern length
            for (const lane of now.song.pats[pi].d) for (let k = S; k < 32; k++) if (lane[k][0]) { check(false, where + ': drum hit beyond step ' + S); break; }
          }
          check(now.params.steps === base.params.steps, where + ': step count changed');
          check(now.params.root === base.params.root, where + ': root changed');
          check(now.params.chain === base.params.chain, where + ': chain changed');
          if (s.scale == null) check(now.params.scale === base.params.scale, where + ': scale changed');
          check(now.params.bpm === (s.bpm != null ? s.bpm : base.params.bpm), where + ': tempo is ' + now.params.bpm);
          check(now.params.chord === s.chord, where + ': chord setting');
          const hits = now.song.pats.reduce((n, p) => n + p.d.reduce((m, l) => m + l.reduce((q, st) => q + st[0], 0), 0), 0);
          if (s.drums === null || s.drums === undefined && false) check(hits === 0, where + ': drumless style has ' + hits + ' drum hits');
          if (s.drums) check(hits > 0, where + ': style has drums but none were written');
          // no stacking: applying a second style from here equals applying it from the original
          const other = R.Style.list[(R.Style.list.indexOf(s) + 5) % R.Style.list.length];
          R.Style.apply(other.id); const viaChain = snap();
          R.Style.apply('original'); R.Style.apply(other.id); const direct = snap();
          check(viaChain === direct, where + ' then ' + other.id + ': result depends on the previous style');
          // original restores the song exactly
          R.Style.apply('original');
          check(snap() === baseKey, where + ': "original" did not restore the song exactly');
        }
      }
    }
    return { fails, checks };
  };

  /* ---------------- offline audio ---------------- */
  const db = (x) => (x > 1e-9 ? 20 * Math.log10(x) : -180);
  window.renderOffline = async function (o) {
    o = o || {};
    if (o.song) R.Songs.load(o.song); else R.Presets.loadFactory(o.factory | 0);
    if (o.steps != null) R.setParam('steps', o.steps);
    R.Style.current = 'original'; R.Style.base = null;
    if (o.style && o.style !== 'original') R.Style.apply(o.style);
    const SR = 44100, secs = o.secs || 8, frames = Math.ceil(secs * SR / 128) * 128;
    const ctx = new OfflineAudioContext(2, frames, SR);
    E.init(ctx);
    R.Seq.start(0.05);
    // advance the sequencer in short slices exactly like the live clock does (never schedule everything at once)
    const slice = 128 * 20;
    for (let f = slice; f < frames; f += slice) {
      const t = f / SR;
      ctx.suspend(t).then(() => { R.Seq.advanceTo(t + 0.2); E.sweep(); ctx.resume(); });
    }
    R.Seq.advanceTo(0.25);
    const buf = await ctx.startRendering();
    R.Seq.stop();
    const L = buf.getChannelData(0), Rr = buf.getChannelData(1);
    let peak = 0, sum = 0, bad = 0, clipped = 0;
    const win = Math.floor(SR * 0.25), winRms = [];
    for (let w = 0; w + win <= L.length; w += win) {
      let s = 0;
      for (let i = w; i < w + win; i++) { const a = L[i], b = Rr[i]; s += (a * a + b * b) / 2; }
      winRms.push(Math.sqrt(s / win));
    }
    for (let i = 0; i < L.length; i++) {
      const a = L[i], b = Rr[i];
      if (!isFinite(a) || !isFinite(b)) { bad++; continue; }
      const m = Math.max(Math.abs(a), Math.abs(b));
      if (m > peak) peak = m;
      if (m >= 0.999) clipped++;
      sum += (a * a + b * b) / 2;
    }
    const active = winRms.filter((r) => db(r) > -60);
    return {
      name: R.Presets.current, style: R.Style.current, bpm: R.P.bpm, steps: R.STEPS[R.P.steps],
      peakDb: +db(peak).toFixed(1), rmsDb: +db(Math.sqrt(sum / L.length)).toFixed(1),
      activeFrac: +(active.length / winRms.length).toFixed(2), nonFinite: bad, clipped,
      voicesAtEnd: E.activeVoices(),
    };
  };

  /* ---------------- songs: compare with published public-domain scores ---------------- */
  // A tiny reader for the LilyPond snippets that Wikipedia embeds for public-domain tunes (relative or absolute pitch,
  // durations, dots, ties, rests). Enough to turn those snippets into [{ midi, d }] where d is in sixteenth-note steps.
  function lily(text, start, abs) {
    const SEMIS = [0, 2, 4, 5, 7, 9, 11], LET = { c: 0, d: 1, e: 2, f: 3, g: 4, a: 5, b: 6 };
    const clean = text.replace(/%[^\n]*/g, ' ').replace(/[()\[\]|]/g, ' ');
    let prev = 0;
    if (!abs) { const m = /^([a-g])([',]*)$/.exec(start); prev = ((m[2].split("'").length - 1) - (m[2].split(',').length - 1)) * 7 + LET[m[1]]; }
    let dur = 4, dots = 0, lastMidi = null, tie = false;
    const out = [];
    const stepsOf = (n, dt) => (16 / n) * (dt === 1 ? 1.5 : dt === 2 ? 1.75 : 1);
    for (let tok of clean.split(/\s+/).filter(Boolean)) {
      let tied = false;
      if (tok.endsWith('~')) { tied = true; tok = tok.slice(0, -1); }
      let m;
      if ((m = /^r(\d+)?(\.*)$/.exec(tok))) { if (m[1]) { dur = +m[1]; dots = m[2].length; } out.push({ midi: null, d: stepsOf(dur, dots) }); continue; }
      if ((m = /^(\d+)(\.*)$/.exec(tok))) { dur = +m[1]; dots = m[2].length; out.push({ midi: lastMidi, d: stepsOf(dur, dots) }); continue; }
      m = /^([a-g])(is|es)?([',]*)(\d+)?(\.*)$/.exec(tok);
      if (!m) throw new Error('lily token not understood: ' + tok);
      const L = LET[m[1]], acc = m[2] === 'is' ? 1 : m[2] === 'es' ? -1 : 0;
      const up = m[3].split("'").length - 1, down = m[3].split(',').length - 1;
      let o;
      if (abs) o = up - down;
      else { let best = null; for (let o0 = -3; o0 <= 6; o0++) { const dd = Math.abs(o0 * 7 + L - prev); if (best == null || dd < best[0]) best = [dd, o0]; } o = best[1] + up - down; }
      prev = o * 7 + L;
      if (m[4]) { dur = +m[4]; dots = m[5].length; }
      const midi = 48 + 12 * o + SEMIS[L] + acc;
      const d = stepsOf(dur, dots);
      if (tie && out.length && out[out.length - 1].midi === midi) out[out.length - 1].d += d; else out.push({ midi, d });
      lastMidi = midi; tie = tied;
    }
    return out;
  }
  const notesOnly = (ev) => ev.filter((e) => e.midi != null);

  /* Reference snippets are from the public-domain scores embedded in the Wikipedia articles for each piece (checked 2026-10). */
  const REFS = {
    ode: [{ src: "b' b c d | d c b a | g g a b | b4. a8 a2 | b4 b c d | d c b a | g g a b | a4. g8 g2", start: "c'" }],
    canon: [{ src: "fis4 e d cis | b a b cis | d cis b a | g fis g e | d8 fis a g fis d fis e | d b d a' g b a g | fis8 d e cis' d fis a a, | b g a fis d d' d8. cis16", start: "c''" }],
    elise: [{ src: "e''16 dis'' | e'' dis'' e'' b' d'' c'' | a'8 r16 c' e' a' | b'8 r16 e' gis' b' | c''8 r16 e' e'' dis'' | e'' dis'' e'' b' d'' c''", abs: true, skipRef: 2 }],
    kleine: [{ src: "g4 r8 d8 g4 r8 d8 | g8 d g b d4 r4 | c4 r8 a8 c4 r8 a8 | c8 a fis a d,4 r4", start: "c'''" }],
    mountain: [
      { src: "b,8 cis d e fis d fis4 | eis8 cis eis4 e8 c e4 | b8 cis d e fis d fis b | a fis d fis a4 r4", start: 'd', intervals: true },
      /* The published snippet writes bar 3 as 'fis, gis ais ...' with no duration, so LilyPond carries over the previous quarter-note
        and the bar would be 7 beats long in 4/4. Bar 1 has the identical figure in eighths, so the duration is restored here. */
      { src: "fis8 gis ais b cis ais cis4 | d8 ais d4 cis8 ais cis4 | fis,8 gis ais b cis ais cis4 | d8 ais d4 cis4 r4", start: 'c', intervals: true },
    ],
    gymnopedie: [{ src: "r4 fis4 a g | fis cis b | cis d a2.", start: "c''" }],
    auldlangsyne: [{ src: "f4. f8 f4 a4 | g4. f8 g4 a4 | f4. f8 a4 c4 | d2. d4 | c4. a8 a4 f4 | g4. f8 g4 a4 | f4. d8 d4 c4 | f2.", start: "c'" }],
    grace: [{ src: "g2 b8 g8 | b2 a4 | g2 e4 | d2 d4 | g2 b8 g8 | b2 a4 | g2.", start: "d'" }],
    scarborough: [{ src: "d2 4 | a'8 a4. a4 | e4. f8 e4 | d2. | r4 a' c4 | d2 c4 | a b g | a2 d4", start: "c'" }],
  };

  window.verifySongs = function () {
    const fails = [], report = [];
    for (const song of R.Songs.list) {
      const ev = R.Songs.parse(song.text), mine = notesOnly(ev);
      const total = ev.reduce((n, e) => n + e.d, 0), want = song.S * (song.chain === 3 ? 4 : 2);
      const where = song.id;
      if (total !== want) fails.push(where + ': ' + total + ' steps written but ' + want + ' expected for ' + song.S + ' steps x ' + (song.chain === 3 ? 4 : 2) + ' patterns');
      const pitches = mine.map((e) => e.midi);
      if (Math.min(...pitches) < 36 || Math.max(...pitches) > 96) fails.push(where + ': notes outside a playable range');
      // how much of the tune is inside its declared key (chromatic notes are legitimate in Fur Elise / Mountain King)
      const iv = R.SCALES[song.scale].iv, inKey = mine.filter((e) => iv.indexOf((((e.midi - song.root) % 12) + 12) % 12) >= 0).length / mine.length;
      if (inKey < 0.6) fails.push(where + ': only ' + Math.round(inKey * 100) + '% of notes are in the declared key');
      // the compiled sequencer strings must round-trip to the same notes
      const comp = R.Songs.compile(song);
      let roundTrip = 0;
      comp.patterns.forEach((p) => { roundTrip += p.split(/\s+/).filter((t) => t !== '.').length; });
      if (roundTrip !== mine.length) fails.push(where + ': ' + mine.length + ' notes written but ' + roundTrip + ' in the sequencer patterns');

      let status = song.verified === 'score' ? 'score' : 'memory';
      if (song.verified === 'score') {
        const refs = REFS[song.id];
        if (!refs) { fails.push(where + ': marked as score-checked but has no reference'); status = 'NO REFERENCE'; }
        else {
          let at = 0, compared = 0;
          for (const r of refs) {
            let ref = notesOnly(lily(r.src, r.start, r.abs));
            if (r.skipRef) ref = ref.slice(r.skipRef);
            const seg = mine.slice(at, at + ref.length);
            for (let i = 0; i < ref.length; i++) {
              const a = ref[i], b = seg[i];
              if (!b) { fails.push(where + ': song is shorter than its reference (note ' + (i + 1) + ')'); break; }
              if (a.d !== b.d) { fails.push(where + ': note ' + (at + i + 1) + ' length ' + b.d + ' but the score says ' + a.d); break; }
              if (r.intervals) {
                if (i === 0 ? ((a.midi % 12) !== (b.midi % 12)) : ((a.midi - ref[i - 1].midi) !== (b.midi - seg[i - 1].midi))) { fails.push(where + ': note ' + (at + i + 1) + ' differs in pitch from the score (interval check)'); break; }
              } else if (a.midi !== b.midi) { fails.push(where + ': note ' + (at + i + 1) + ' is ' + b.midi + ' but the score says ' + a.midi); break; }
            }
            at += ref.length; compared += ref.length;
          }
          status = 'score (' + compared + ' notes compared)';
        }
      }
      report.push(song.id.padEnd(13) + String(mine.length).padStart(3) + ' notes  ' + String(total).padStart(3) + ' steps  in-key ' + String(Math.round(inKey * 100)).padStart(3) + '%  ' + status);
    }
    return { fails, report };
  };

  window.__verifyReady = true;
})();
</script>
</body>
</html>
