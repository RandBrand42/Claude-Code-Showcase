<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/views.css">
<script>
  /* apply the saved / system theme before first paint to avoid a flash */
  (function () {
    var t = 'system', d = 'comfortable';
    try { t = localStorage.getItem('meridian.theme') || 'system'; d = localStorage.getItem('meridian.density') || 'comfortable'; } catch (e) {}
    var dark = t === 'dark' || (t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-density', d);
  })();
</script>
</head>

</div>
